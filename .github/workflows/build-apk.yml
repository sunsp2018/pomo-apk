name: Build Android APK

on:
  workflow_dispatch:        # 手动触发：在 GitHub 仓库的 Actions 页点 Run workflow
  push:
    branches: [main]        # 也可推到 main 分支自动构建

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17      # Android 构建必须用 JDK 17

      - uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK
        run: yes | sdkmanager --licenses && sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Install Capacitor
        run: npm install

      - name: Add & Sync Android
        run: npx cap add android 2>/dev/null || true; npx cap sync android

      - name: Inject native alarm plugin
        run: python3 native/inject-android.py

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
